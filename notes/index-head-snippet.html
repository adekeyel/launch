<!--
  Paste these inside <head> in your project's index.html (the file at the project
  root, next to /src). WhatsApp, Facebook, X and Google read link previews from
  this file BEFORE any JavaScript runs, so they can't be set from React.

  1. Replace YOUR-DOMAIN with your live site address.
  2. Put a 1200x630 image (logo + tagline on your dark green/marigold background
     works well) in /public as og-image.png.
-->
<title>LAUNCH TIME | Order from local kitchens</title>
<meta name="description" content="Order food from local kitchens near you. Browse verified vendors, add dishes to your cart and track your order." />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="LAUNCH TIME" />
<meta property="og:title" content="LAUNCH TIME | Order from local kitchens" />
<meta property="og:description" content="Order food from local kitchens near you. Browse verified vendors, add dishes to your cart and track your order." />
<meta property="og:url" content="https://YOUR-DOMAIN/" />
<meta property="og:image" content="https://YOUR-DOMAIN/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
